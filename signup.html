<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up Form | Aura Hospitality</title>
  <meta name="description" content="Sign Up Form for registering Aura Hospitality portal access.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500..800;1,500..800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/main.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/animations.css">

  <style>
    body {
      background: #0B111E;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .simple-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 2.5rem;
      background: #0F172A;
      border-bottom: 2px solid #C5A059;
    }
    .auth-card-wrapper {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3.5rem 1.5rem;
      position: relative;
    }
    .form-box-card {
      width: 100%;
      max-width: 480px;
      background: #0F172A;
      border-radius: 16px;
      padding: 2.75rem 2.25rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      border: 2px solid #C5A059;
      position: relative;
      z-index: 10;
    }
    .input-field-custom {
      width: 100%;
      padding: 0.85rem 1rem;
      background: #1E293B;
      border: 1.5px solid #334155;
      border-radius: 8px;
      color: #FFFFFF;
      font-size: 0.95rem;
      transition: border-color 0.2s ease;
    }
    .input-field-custom:focus {
      outline: none;
      border-color: #C5A059;
      box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.2);
    }
  </style>
</head>
<body>

  <!-- SECTION 1: Top Bar with Logo -->
  <section id="top-bar-section" style="padding: 0;">
    <div class="simple-topbar" style="justify-content: center;">
      <a href="index.html" class="logo-brand"><img src="assets/logo.webp" alt="Stackly Logo" class="logo-image"></a>
    </div>
  </section>

  <!-- SECTION 2: Outer Signup Layout Wrapper -->
  <section id="signup-outer-wrapper" style="padding: 0;">
    
    <!-- SECTION 3: Card Flex Container -->
    <section id="signup-card-container" class="auth-card-wrapper">
      
      <!-- SECTION 4: Ambient Background Glow -->
      <section id="ambient-glow-section" style="padding: 0; margin: 0;">
        <div class="ambient-orb orb-gold" style="top: 30%; left: 50%; transform: translateX(-50%); width: 380px; height: 380px; opacity: 0.15; pointer-events: none;"></div>
      </section>

      <div class="form-box-card">
        
        <!-- SECTION: Back to Home Button (Below Header) -->
        <section id="back-button-section" style="margin-bottom: 1.25rem; text-align: left;">
          <a href="index.html" style="color: #C5A059; text-decoration: none; font-size: 0.85rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.45rem 0.9rem; background: rgba(197, 160, 89, 0.12); border: 1px solid rgba(197, 160, 89, 0.3); border-radius: 6px; transition: all 0.2s ease;">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
          </a>
        </section>
        
        <!-- SECTION 5: Card Title Header -->
        <section id="card-header-section" style="text-align: center; margin-bottom: 1.75rem;">
          <h1 style="font-size: 2rem; color: #FFFFFF; font-weight: 800; margin-bottom: 0.4rem;" class="text-gold-gradient">Sign Up Form</h1>
          <p style="color: #94A3B8; font-size: 0.9rem;">Fill in your details to create & validate your account.</p>
        </section>

        <!-- SECTION 6: Registration Form Container -->
        <section id="registration-form-section" style="padding: 0; margin: 0;">
          <form id="signup-portal-form">
            <input type="hidden" id="signup-role" value="admin">
            
            <!-- SECTION 7: Full Name Field -->
            <section id="name-field-section" style="padding: 0; margin: 0;">
              <div class="form-group" style="margin-bottom: 1.1rem;">
                <label style="display: block; color: #E2E8F0; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.4rem;">Full Name</label>
                <input type="text" id="signup-name" class="input-field-custom" placeholder="Enter your full name..." required>
              </div>
            </section>

            <!-- SECTION 8: Email Input Field -->
            <section id="email-field-section" style="padding: 0; margin: 0;">
              <div class="form-group" style="margin-bottom: 1.1rem;">
                <label style="display: block; color: #E2E8F0; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.4rem;">Email Address</label>
                <input type="email" id="signup-email" class="input-field-custom" placeholder="Enter your email address..." required>
              </div>
            </section>

            <!-- SECTION 9: Password Fields Section -->
            <section id="password-fields-section" style="padding: 0; margin: 0;">
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.1rem;">
                <div class="form-group">
                  <label style="display: block; color: #E2E8F0; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Password</label>
                  <input type="password" id="signup-password" class="input-field-custom" placeholder="••••••••••••" required>
                </div>
                <div class="form-group">
                  <label style="display: block; color: #E2E8F0; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Confirm Password</label>
                  <input type="password" id="signup-confirm-password" class="input-field-custom" placeholder="••••••••••••" required>
                </div>
              </div>
            </section>

            <!-- SECTION 10: Submit Button Container -->
            <section id="submit-button-section" style="margin-top: 1.5rem;">
              <button type="submit" class="btn-aura btn-gold shimmer-btn" style="width: 100%; height: 50px; font-size: 1.05rem; font-weight: 700; justify-content: center; border-radius: 8px;">
                <i class="fa-solid fa-user-plus"></i> Complete Sign Up & Go to Sign In
              </button>
            </section>
          </form>
        </section>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #94A3B8;">
          Already have an account? <a href="login.html" style="color: #C5A059; font-weight: 700; text-decoration: none;">Sign In Here</a>
        </div>

      </div>
    </section>
  </section>

  <!-- SECTION 10: Simple Footer -->
  <section id="footer-section" style="padding: 0;">
    <footer style="background: #0F172A; color: #94A3B8; padding: 1.25rem 0; text-align: center; font-size: 0.85rem; border-top: 2px solid #C5A059;">
      &copy; 2026 Stackly Aura Hospitality Group Inc. All Rights Reserved. <a href="index.html" style="color: #C5A059; margin-left: 0.5rem; font-weight: 600; text-decoration: none;"><i class="fa-solid fa-house"></i> Go to Home</a>
    </footer>
  </section>

  <script src="assets/mockData.js"></script>
  <script src="assets/toast.js"></script>

  <script>
    function fillSignupDemo(type) {
      if (type === 'admin') {
        document.getElementById('signup-name').value = 'Lady Eleanor Vance';
        document.getElementById('signup-email').value = 'admin@aurahospitality.com';
        document.getElementById('signup-password').value = 'AuraPass2026!';
        document.getElementById('signup-confirm-password').value = 'AuraPass2026!';
        document.getElementById('signup-role').value = 'admin';
      } else {
        document.getElementById('signup-name').value = 'Sophia Martinez';
        document.getElementById('signup-email').value = 'staff@aurahospitality.com';
        document.getElementById('signup-password').value = 'AuraPass2026!';
        document.getElementById('signup-confirm-password').value = 'AuraPass2026!';
        document.getElementById('signup-role').value = 'staff';
      }
      Toast.show("Sample Data Loaded", "Form fields populated for registration.", "info");
    }

    document.getElementById('signup-portal-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const pass = document.getElementById('signup-password').value;
      const confirmPass = document.getElementById('signup-confirm-password').value;
      const role = document.getElementById('signup-role') ? document.getElementById('signup-role').value : 'admin';

      if (!name || !email || !pass || !confirmPass) {
        Toast.show("Validation Error", "Please fill in all required form fields.", "error");
        return;
      }

      if (pass !== confirmPass) {
        Toast.show("Validation Error", "Passwords do not match. Please verify your passwords.", "error");
        return;
      }

      sessionStorage.setItem('aura_user_email', email);
      sessionStorage.setItem('aura_user_name', name);
      sessionStorage.setItem('aura_user_role', role);

      Toast.show("Sign Up Successful!", "Data validated successfully! Redirecting to Sign In page...", "success", 2500);
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1000);
    });
  </script>
</body>
</html>
